<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chúc mừng Giáng Sinh 🎄</title>
    <style>
      :root {
        --text: rgba(255, 255, 255, 0.92);
      }
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(
            1200px 600px at 70% 10%,
            rgba(255, 255, 255, 0.12),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 20% 0%,
            rgba(120, 180, 255, 0.18),
            transparent 55%
          ),
          linear-gradient(180deg, #061428 0%, #0b2442 55%, #102a46 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
            2px 2px at 20% 30%,
            rgba(255, 255, 255, 0.65),
            transparent 55%
          ),
          radial-gradient(
            1px 1px at 60% 18%,
            rgba(255, 255, 255, 0.55),
            transparent 55%
          ),
          radial-gradient(
            1.5px 1.5px at 82% 44%,
            rgba(255, 255, 255, 0.45),
            transparent 55%
          ),
          radial-gradient(
            1px 1px at 35% 70%,
            rgba(255, 255, 255, 0.35),
            transparent 55%
          ),
          radial-gradient(
            1.5px 1.5px at 72% 78%,
            rgba(255, 255, 255, 0.35),
            transparent 55%
          );
        opacity: 0.55;
        filter: blur(0.2px);
      }

      .card {
        position: relative;
        width: min(920px, 92vw);
        min-height: 520px;
        padding: 28px 24px 20px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(12, 25, 44, 0.35);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 18px;
        align-items: center;
      }

      @media (max-width: 860px) {
        .card {
          grid-template-columns: 1fr;
          min-height: auto;
          padding: 22px 18px 16px;
        }
      }

      .text h1 {
        margin: 0 0 10px;
        letter-spacing: 0.3px;
        font-size: clamp(30px, 4vw, 52px);
        line-height: 1.05;
      }

      .text p {
        margin: 0 0 16px;
        max-width: 46ch;
        font-size: clamp(16px, 2vw, 18px);
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.82);
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: #1f3b5b; /* nền đậm hơn */
        color: #ffffff; /* chữ trắng rõ */
        padding: 10px 14px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.2px;
        transition: background 0.2s ease, border-color 0.2s ease,
          transform 0.08s ease, box-shadow 0.2s ease;
      }

      button:hover {
        background: #2a4e78;
        border-color: rgba(255, 255, 255, 0.55);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      }

      button:active {
        transform: translateY(1px);
      }

      button.secondary {
        background: #1f3b5b; /* nút phụ vẫn đủ contrast */
      }

      .sub {
        margin-top: 14px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.65);
      }

      .treeWrap {
        position: relative;
        width: 360px;
        height: 480px;
        display: grid;
        place-items: center;
        margin-inline: auto;
      }

      .tree {
        position: relative;
        width: 320px;
        height: 440px;
      }

      .star {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        filter: drop-shadow(0 0 12px rgba(255, 220, 120, 0.65));
        animation: starPulse 2.4s infinite ease-in-out;
      }

      @keyframes starPulse {
        0%,
        100% {
          transform: translateX(-50%) scale(0.98);
          opacity: 0.85;
        }
        50% {
          transform: translateX(-50%) scale(1.05);
          opacity: 1;
        }
      }

      .treeBody {
        position: absolute;
        top: 38px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 340px;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        background: linear-gradient(
            180deg,
            rgba(40, 190, 120, 0.1),
            transparent 55%
          ),
          linear-gradient(180deg, #0a6b3c 0%, #084b2d 65%, #063824 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .treeBody::before {
        content: "";
        position: absolute;
        inset: -40px -40px;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06) 0px,
          rgba(255, 255, 255, 0.06) 2px,
          rgba(0, 0, 0, 0) 10px,
          rgba(0, 0, 0, 0) 16px
        );
        opacity: 0.25;
        transform: rotate(-4deg);
      }

      .treeBody::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          200px 120px at 50% 0%,
          rgba(140, 200, 255, 0.2),
          transparent 70%
        );
        pointer-events: none;
      }

      .trunk {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 64px;
        height: 76px;
        border-radius: 10px;
        background: linear-gradient(180deg, #6b3f22, #3b2416);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }

      .baseSnow {
        display: none;
      }

      .light {
        position: absolute;
        left: 50%;
        top: 0;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        transform: translate(var(--tx), var(--ty));
        background: hsl(var(--h) 92% 60%);
        box-shadow: 0 0 10px hsla(var(--h) 92% 70% / 0.9),
          0 0 22px hsla(var(--h) 92% 60% / 0.7);
        opacity: 0.65;
        animation: twinkle var(--t) infinite ease-in-out;
        animation-delay: var(--d);
      }

      @keyframes twinkle {
        0%,
        100% {
          transform: translate(var(--tx), var(--ty)) scale(0.9);
          opacity: 0.35;
        }
        45% {
          transform: translate(var(--tx), var(--ty)) scale(1.15);
          opacity: 1;
        }
        65% {
          transform: translate(var(--tx), var(--ty)) scale(0.98);
          opacity: 0.75;
        }
      }

      .paused .light {
        animation-play-state: paused;
      }
      .paused .star {
        animation-play-state: paused;
      }

      canvas#snow {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .light,
        .star {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="snow"></canvas>

    <main class="card">
      <section class="text">
        <h1>Chúc mừng Giáng Sinh 🎄✨</h1>
        <p>
          Mong bạn có một mùa Noel ấm áp, vui vẻ và một năm mới thật nhiều điều
          tốt lành!
        </p>

        <div class="actions">
          <button id="toggle">Tạm dừng / Chạy hiệu ứng</button>
          <button class="secondary" id="moreSnow">Tăng tuyết</button>
          <button id="musicBtn">🔊 Phát nhạc</button>
        </div>

        <!-- <div class="sub">Bạn có thể sửa lời chúc ngay trong file này.</div> -->
      </section>

      <section class="treeWrap" aria-label="Cây thông Noel">
        <div class="tree">
          <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#ffe08a" />
                <stop offset="1" stop-color="#ffd36a" />
              </linearGradient>
            </defs>
            <path
              fill="url(#g)"
              d="M50 6 L61 36 L94 36 L67 54 L77 84 L50 66 L23 84 L33 54 L6 36 L39 36 Z"
            />
          </svg>

          <div class="treeBody" id="treeBody"></div>
          <div class="trunk"></div>
          <div class="baseSnow"></div>
        </div>
      </section>
    </main>

    <audio id="bgm" loop preload="auto">
      <source src="assets/noel.mp3" type="audio/mpeg" />
    </audio>

    <script>
      (() => {
        // ---------- Lights ----------
        const treeBody = document.getElementById("treeBody");
        const W = treeBody.clientWidth;
        const H = treeBody.clientHeight;
        const lightCount = 46;

        const rand = (min, max) => Math.random() * (max - min) + min;

        for (let i = 0; i < lightCount; i++) {
          const y = rand(16, H - 20);
          const halfWidthAtY = (y / H) * (W / 2) * 0.98;
          const x = rand(-halfWidthAtY, halfWidthAtY);

          const hue = Math.floor(rand(0, 360));
          const duration = rand(1.25, 2.85).toFixed(2) + "s";
          const delay = rand(0, 2.2).toFixed(2) + "s";

          const light = document.createElement("span");
          light.className = "light";
          light.style.setProperty("--tx", `${x}px`);
          light.style.setProperty("--ty", `${y}px`);
          light.style.setProperty("--h", hue);
          light.style.setProperty("--t", duration);
          light.style.setProperty("--d", delay);

          const size = rand(8, 12);
          light.style.width = size + "px";
          light.style.height = size + "px";

          treeBody.appendChild(light);
        }

        // ---------- Snow ----------
        const canvas = document.getElementById("snow");
        const ctx = canvas.getContext("2d", { alpha: true });

        let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        let width = 0,
          height = 0;

        function resize() {
          width = Math.floor(window.innerWidth);
          height = Math.floor(window.innerHeight);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener("resize", resize, { passive: true });
        resize();

        const prefersReduce =
          globalThis.matchMedia &&
          globalThis.matchMedia("(prefers-reduced-motion: reduce)").matches;

        let flakeCount = prefersReduce ? 0 : 220;
        let flakes = [];

        function resetFlakes() {
          flakes = new Array(flakeCount).fill(0).map(() => ({
            x: rand(0, width),
            y: rand(0, height),
            r: rand(0.8, 2.4),
            vy: rand(0.6, 1.9),
            vx: rand(-0.35, 0.35),
            a: rand(0.25, 0.9),
          }));
        }
        resetFlakes();

        let running = !prefersReduce;
        let rafId = 0;

        function draw() {
          if (!running) return;
          ctx.clearRect(0, 0, width, height);

          // fog nhẹ
          ctx.fillStyle = "rgba(255,255,255,0.035)";
          ctx.fillRect(0, 0, width, height);

          for (const f of flakes) {
            ctx.beginPath();
            ctx.fillStyle = `rgba(255,255,255,${f.a})`;
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();

            f.y += f.vy;
            f.x += f.vx;

            f.vx += rand(-0.02, 0.02);
            f.vx = Math.max(-0.6, Math.min(0.6, f.vx));

            if (f.y > height + 10) {
              f.y = -10;
              f.x = rand(0, width);
            }
            if (f.x < -10) f.x = width + 10;
            if (f.x > width + 10) f.x = -10;
          }

          rafId = requestAnimationFrame(draw);
        }

        if (running) draw();

        // ---------- Controls ----------
        document.getElementById("toggle").addEventListener("click", () => {
          document.body.classList.toggle("paused");
          running = !running;
          cancelAnimationFrame(rafId);
          if (running) draw();
        });

        document.getElementById("moreSnow").addEventListener("click", () => {
          if (prefersReduce) return;
          flakeCount = Math.min(520, flakeCount + 80);
          resetFlakes();
        });
      })();
      // ---------- Music ----------
      const bgm = document.getElementById("bgm");
      const musicBtn = document.getElementById("musicBtn");

      bgm.volume = 0.6; // chỉnh âm lượng tại đây (0 -> 1)

      musicBtn.addEventListener("click", async () => {
        try {
          if (bgm.paused) {
            await bgm.play();
            musicBtn.textContent = "🔈 Tắt nhạc";
          } else {
            bgm.pause();
            musicBtn.textContent = "🔊 Phát nhạc";
          }
        } catch {
          alert("Trình duyệt chặn autoplay. Bạn bấm lại lần nữa nha 🎵");
        }
      });

      // Tự pause khi chuyển tab (lịch sự + chuyên nghiệp)
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && !bgm.paused) {
          bgm.pause();
          musicBtn.textContent = "🔊 Phát nhạc";
        }
      });
    </script>
  </body>
</html>
